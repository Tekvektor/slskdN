name: slskdn
base: core22
version: '2026101723-slskdn.351'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/2026101723-slskdn.351/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/d8a2c3b6d747208711d860a0856f054751f93942858e7c00d2a65e15ce3b7b11
    stage-packages:
      - libicu70
      - libssl3
